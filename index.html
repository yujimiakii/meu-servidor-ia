<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório Secreto - IA</title>
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Bibliotecas -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #39ff14; /* Verde Neon */
            --bg-dark: #0a0b0c;
            --bg-panel: #161b22;
            --text-color: #e6edf3;
            --accent: #00d4ff; /* Azul Bio */
            --danger: #ff4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Fira Code', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 11, 12, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; backdrop-filter: blur(10px);
        }

        .login-box {
            background: var(--bg-panel);
            padding: 40px; border-radius: 15px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
            text-align: center;
        }

        .login-box h1 { margin-bottom: 20px; color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        
        input[type="text"] {
            background: #000; border: 1px solid var(--primary);
            color: var(--primary); padding: 12px; width: 100%;
            border-radius: 5px; outline: none; font-family: inherit;
        }

        button {
            background: var(--primary); color: #000; border: none;
            padding: 12px 25px; border-radius: 5px; cursor: pointer;
            font-weight: bold; margin-top: 15px; transition: 0.3s;
        }

        button:hover { background: #fff; box-shadow: 0 0 20px #fff; }

        #main-container {
            width: 90%; max-width: 900px; height: 85vh;
            background: var(--bg-panel); border-radius: 15px;
            border: 1px solid #30363d; display: flex; flex-direction: column;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .header {
            padding: 15px 25px; border-bottom: 1px solid #30363d;
            display: flex; justify-content: space-between; align-items: center;
        }

        .header h2 { color: var(--primary); font-size: 1.1rem; }

        #chat-window {
            flex-grow: 1; overflow-y: auto; padding: 25px;
            display: flex; flex-direction: column; gap: 20px;
        }

        .message { max-width: 80%; padding: 15px; border-radius: 10px; line-height: 1.5; }
        
        .user-message {
            align-self: flex-end; background: #21262d;
            border-right: 4px solid var(--accent); color: var(--accent);
        }

        .ia-message {
            align-self: flex-start; background: #0d1117;
            border-left: 4px solid var(--primary); border: 1px solid #30363d;
        }

        .message-header { font-size: 0.7rem; margin-bottom: 8px; opacity: 0.6; text-transform: uppercase; }

        .input-area {
            padding: 15px 20px; border-top: 1px solid #30363d;
            display: flex; flex-direction: column; gap: 10px; background: #0d1117;
            border-bottom-left-radius: 15px; border-bottom-right-radius: 15px;
        }

        .doc-bar {
            display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: #8b949e;
        }

        .input-row { display: flex; gap: 10px; }

        #pergunta { flex-grow: 1; background: transparent; border: 1px solid #30363d; padding: 12px; color: #fff; border-radius: 8px; }

        .btn-send { width: auto; margin-top: 0; background: var(--primary); }

        #ranking-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 350px; background: var(--bg-panel); border: 2px solid gold;
            padding: 25px; border-radius: 15px; z-index: 1000; box-shadow: 0 0 100px #000;
        }

        .ranking-item {
            display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px solid #30363d; font-size: 0.9rem;
        }

        .gold { color: gold; font-weight: bold; }
        .hidden { display: none !important; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h1><i class="fas fa-flask"></i> LABORATÓRIO</h1>
            <p style="margin-bottom: 15px; opacity: 0.7;">Insira suas credenciais de cientista</p>
            <input type="text" id="nickname" placeholder="Digite seu Nickname..." onkeypress="if(event.key==='Enter') entrarNoSistema()">
            <button onclick="entrarNoSistema()">ACESSAR SISTEMA</button>
        </div>
    </div>

    <!-- TELA PRINCIPAL -->
    <div id="main-container">
        <div class="header">
            <h2><i class="fas fa-terminal"></i> OVERFLOWIA_OS v2.0</h2>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="health-indicator" style="width: 12px; height: 12px; border-radius: 50%; background: grey; display: inline-block;"></span>
                <button onclick="mostrarRanking()" style="width: auto; background: gold; margin-top: 0; padding: 8px 15px;"><i class="fas fa-trophy"></i> RANKING</button>
            </div>
        </div>

        <div id="chat-window">
            <div class="message ia-message">
                <div class="message-header">SISTEMA</div>
                Olá Cientista. O reator está estável. Você pode enviar perguntas comuns ou carregar um PDF/TXT para consultar como analista corporativo!
            </div>
        </div>

        <div class="input-area">
            <!-- Barra de upload RAG -->
            <div class="doc-bar">
                <label><input type="checkbox" id="modoDoc"> <strong>Modo Analista RAG</strong></label>
                <input type="file" id="docUpload" accept=".pdf, .txt" style="color: #fff; font-size: 0.8rem;">
            </div>
            <div class="input-row">
                <input type="text" id="pergunta" placeholder="Pergunte algo ou tire dúvida sobre o documento..." onkeypress="if(event.key==='Enter') enviarMsg()">
                <button class="btn-send" onclick="enviarMsg()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- MODAL RANKING -->
    <div id="ranking-modal" class="hidden">
        <h2 style="text-align: center; color: gold; margin-bottom: 15px;"><i class="fas fa-crown"></i> HALL DA FAMA</h2>
        <div id="ranking-corpo"></div>
        <button onclick="fecharRanking()" style="background: var(--danger); color: white; width: 100%;">FECHAR</button>
    </div>

    <script>
        let userNick = "";
        let authToken = "";

        // DETECÇÃO AUTOMÁTICA DE URL:
        // Se estiver abrindo via Live Server (portas 5500, 5501, etc.), aponta para a porta 3000 do Node.
        // Se estiver no Vercel ou acessando direto http://localhost:3000, usa a URL do próprio domínio.
        const isLiveServer = window.location.port.startsWith("55") || window.location.protocol === "file:";
        const API_URL = isLiveServer ? "http://localhost:3000/api" : window.location.origin + "/api";

        async function entrarNoSistema() {
            const input = document.getElementById('nickname');
            if (input.value.trim().length < 3) return alert("Nickname muito curto!");
            userNick = input.value.trim();

            try {
                // Obtém o token JWT
                const res = await fetch(`${API_URL}/auth/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname: userNick })
                });

                if (!res.ok) {
                    const erroJson = await res.json();
                    throw new Error(erroJson.erro || "Falha ao obter credencial.");
                }

                const data = await res.json();
                authToken = data.token;

                document.getElementById('login-screen').classList.add('hidden');
                checkHealth();
            } catch (err) {
                alert("Erro ao autenticar no laboratório: " + err.message);
            }
        }

        async function enviarMsg() {
            const input = document.getElementById('pergunta');
            const fileInput = document.getElementById('docUpload');
            const modoDoc = document.getElementById('modoDoc').checked;
            const chatWindow = document.getElementById('chat-window');
            const texto = input.value.trim();

            if (!texto) return;

            chatWindow.innerHTML += `
                <div class="message user-message">
                    <div class="message-header">${userNick} ${modoDoc ? '(Consulta Doc)' : ''}</div>
                    ${texto}
                </div>
            `;
            
            input.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                let response;

                if (modoDoc) {
                    if (!fileInput.files[0]) {
                        alert("Por favor, selecione um arquivo PDF ou TXT!");
                        return;
                    }

                    const formData = new FormData();
                    formData.append("arquivo", fileInput.files[0]);
                    formData.append("pergunta", texto);

                    // Envio com FormData e Token JWT na rota do RAG
                    response = await fetch(`${API_URL}/chat/documento`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: formData
                    });
                } else {
                    // Chat normal da Sprint anterior
                    response = await fetch(`${API_URL}/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pergunta: texto, nickname: userNick })
                    });
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.erro || "Erro na resposta do servidor");
                }

                const respostaFinal = data.resposta || data.texto;
                const htmlResposta = marked.parse(respostaFinal);

                chatWindow.innerHTML += `
                    <div class="message ia-message">
                        <div class="message-header">${modoDoc ? 'ANALISTA_CORPORATIVO' : 'CIENTISTA_IA'}</div>
                        ${htmlResposta}
                    </div>
                `;

                if (respostaFinal.toLowerCase().includes("acertou") || respostaFinal.toLowerCase().includes("ganhou")) {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#39ff14', '#ffffff'] });
                }

            } catch (err) {
                chatWindow.innerHTML += `<div class="message" style="color:red">Erro: ${err.message}</div>`;
            }
            
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function mostrarRanking() {
            try {
                const res = await fetch(`${API_URL}/ranking`);
                const jogadores = await res.json();
                const corpo = document.getElementById('ranking-corpo');

                corpo.innerHTML = jogadores.map((j, i) => `
                    <div class="ranking-item ${i === 0 ? 'gold' : ''}">
                        <span>${i+1}º ${j.nickname}</span>
                        <span>${j.xp} XP</span>
                    </div>
                `).join('');

                document.getElementById('ranking-modal').classList.remove('hidden');
            } catch (err) { 
                alert("Não foi possível carregar o ranking."); 
            }
        }

        function fecharRanking() {
            document.getElementById('ranking-modal').classList.add('hidden');
        }

        async function checkHealth() {
            const indicator = document.getElementById('health-indicator');
            if (!indicator) return; 

            try {
                const response = await fetch(`${API_URL}/health`);
                indicator.style.background = response.ok ? '#39ff14' : '#ff4444';
            } catch (err) {
                indicator.style.background = '#ff4444';
            }
        }

        setInterval(checkHealth, 60000);
    </script>
</body>
</html>
